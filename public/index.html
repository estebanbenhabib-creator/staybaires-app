<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Staybaires · Limpieza</title>

  <!-- PWA: instalable en el telefono ("Agregar a inicio") -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#37485e" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Staybaires" />
  <meta name="mobile-web-app-capable" content="yes" />

  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <div id="app"></div>
  <script src="/assets/ingresos-engine.js"></script>
  <script src="/assets/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      // Si ya había un SW controlando la página y entra una versión nueva,
      // recargamos una sola vez para que se vean los cambios sin tener que
      // reinstalar la app (clave en PWA de iOS, que "congela" el código viejo).
      var sbReloading = false;
      if (navigator.serviceWorker.controller) {
        navigator.serviceWorker.addEventListener("controllerchange", function () {
          if (sbReloading) return;
          sbReloading = true;
          window.location.reload();
        });
      }
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/sw.js").then(function (reg) {
          // Buscar una versión más nueva cada vez que se abre la app.
          reg.update();
          reg.addEventListener("updatefound", function () {
            var nw = reg.installing;
            if (!nw) return;
            nw.addEventListener("statechange", function () {
              // Versión nueva lista y ya había una anterior -> activarla.
              if (nw.state === "installed" && navigator.serviceWorker.controller) {
                nw.postMessage({ type: "SKIP_WAITING" });
              }
            });
          });
        }).catch(function () {});
      });
    }
  </script>
</body>
</html>
